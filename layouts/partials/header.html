<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ "/" | relURL }}">Lab<span>4028</span></a>
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" class="nav-{{ .Identifier }}{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.Section .Identifier) }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
